name: Build CH8 Retro APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: CH8-Retro-APK, path: app/build/outputs/apk/debug/*.apk, retention-days: 30}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: arcade-retro-v1
          name: Arcade Retrô — 30 jogos homebrew
          body: 'Arcade Android 6+ nativo/offline, 30 jogos homebrew originais em seis gêneros, joystick virtual. Sem WebView, sem internet em jogo e sem ROM externa. Build de CI; ainda testar no aparelho.'
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
