name: Build CH8 Retro APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: CH8-Retro-APK, path: app/build/outputs/apk/debug/*.apk, retention-days: 30}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ch8-retro-v1
          name: CH8 Retrô — APK de teste
          body: 'Android 6+ nativo/offline. Emulador CHIP-8 e 200 desafios homebrew inclusos. Build de CI; testar no aparelho.'
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
